version: 2
updates:
  # Proposes npm package updates.
  # Minor and patch updates arrive as one weekly PR; each major update gets its own PR.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      npm-packages:
        update-types:
          - minor
          - patch

  # Keeps the actions used in .github/workflows current, one grouped PR a week.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns:
          - "*"
